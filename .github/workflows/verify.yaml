name: Verify foundation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (peeled commit)
        with:
          version: 11.25.0
      - name: Install Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.18.0
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable ref verified 2026-11-03
        with:
          toolchain: 1.98.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo +1.98.0 fetch --locked --manifest-path contracts/registry/Cargo.toml
      - name: Verify without external services or secrets
        run: pnpm verify:offline
